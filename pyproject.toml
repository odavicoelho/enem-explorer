[project]
name = "enem-explorer"
version = "0.1.0"
description = "Turn INEP's raw ENEM microdata into clean, tested, ready-to-use data and a public explorer."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Davi Coelho", email = "coelhodavi.comercial@gmail.com" }]
dependencies = [
  "httpx>=0.28",
  "duckdb>=1.2",
  "typer>=0.15",
  "dbt-core>=1.10",
  "dbt-duckdb>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.22", "ruff==0.17.1", "mypy>=1.14"]

[project.scripts]
enem = "enem_explorer.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enem_explorer"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["enem_explorer"]

[[tool.mypy.overrides]]
module = ["duckdb.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
